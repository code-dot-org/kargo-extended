  names:
    kind: MessageChannel
    plural: messagechannels
    singular: messagechannel
    listKind: MessageChannelList
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              secretRef:
                type: object
                properties:
                  name:
                    type: string
